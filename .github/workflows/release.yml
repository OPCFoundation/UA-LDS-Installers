name: Build

# Every push builds (CI smoke). Pushes of a v* tag additionally publish a
# downloadable GitHub Release.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # windows-2022 already ships VS 2022 Build Tools, CMake, Strawberry Perl,
      # Git and the .NET SDK, which is everything build.ps1 needs except WiX.
      - name: Install WiX (free toolset)
        run: dotnet tool install --global wix

      # OpenSSL 3.5.6 + 1.1.1w together take ~25 min on a cold runner.
      # Cache the install dirs keyed on build.ps1 so version bumps bust the cache.
      - name: Cache OpenSSL builds
        uses: actions/cache@v4
        with:
          path: |
            LDS/stack/openssl-x86
            LDS/stack/openssl-x64
            CertificateGenerator/third-party/openssl
            CertificateGenerator/third-party/openssl-1.1.1w
          key: openssl-${{ runner.os }}-${{ hashFiles('build.ps1') }}

      # AzureSignTool is only required if signing secrets are configured.
      # build.ps1 auto-skips signing when $env:SigningClientSecret is empty,
      # so we install the tool conditionally to keep cold runs lean.
      - name: Install AzureSignTool (only if signing configured)
        if: ${{ env.SIGNING_CLIENT_SECRET != '' }}
        env:
          SIGNING_CLIENT_SECRET: ${{ secrets.SIGNING_CLIENT_SECRET }}
        run: dotnet tool install --global AzureSignTool

      - name: Build (x86 + x64)
        shell: pwsh
        env:
          SigningVaultURL:      ${{ secrets.SIGNING_VAULT_URL }}
          SigningClientId:      ${{ secrets.SIGNING_CLIENT_ID }}
          SigningClientSecret:  ${{ secrets.SIGNING_CLIENT_SECRET }}
          SigningTenantId:      ${{ secrets.SIGNING_TENANT_ID }}
          SigningCertName:      ${{ secrets.SIGNING_CERT_NAME }}
          SigningURL:           ${{ secrets.SIGNING_URL }}
        run: .\build.ps1 -Platform both

      # Workflow-run artifact: only on tag builds. Available for 90 days from
      # the run's "Artifacts" panel; useful for grabbing the bits before the
      # Release is finalized.
      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ua-lds-installers-${{ github.ref_name }}
          path: |
            out/wix/*.msi
            out/wix/*.msm
            dist/*.zip
          if-no-files-found: error

      # GitHub Release: only on tag builds. Permanent, surfaces on the repo's
      # Releases page.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wix/*.msi
            out/wix/*.msm
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
