# Manually-triggered, unsigned build of the LDS installers on a clean
# GitHub-hosted runner. Purpose: verify the build works from a fresh checkout,
# with nothing cached from a developer machine. No signing secrets are
# configured, so build.ps1 skips code signing automatically.

name: Build installers (unsigned)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Architectures to build
        type: choice
        options: [both, x64, x86]
        default: both

permissions:
  contents: read

jobs:
  build:
    # windows-2022 ships VS 2022 with the C++ workload and MSVC v143, which
    # build.ps1 hard-codes (-T v143). It also has CMake and Strawberry Perl.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install WiX
        shell: pwsh
        run: |
          # Pinned to the WiX version the installer authoring is built with.
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          wix --version
          Get-Command perl -All | Select-Object -ExpandProperty Source

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Platform ${{ inputs.platform }}

      # Deliberately NO upload-artifact step. Artifacts inherit repository
      # visibility, so on a public repo anyone signed in to GitHub could
      # download unsigned binaries. This workflow only proves the build works;
      # the summary below records what was produced, without publishing it.
      - name: Verify outputs and write summary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out/wix/*.msi, out/wix/*.msm, dist/*.zip -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'Build produced no installers.' }
          $summary = @('## Build outputs (not published)', '', '| File | Size | SHA-256 |', '| --- | ---: | --- |')
          foreach ($f in $files) {
              $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              $summary += "| $($f.Name) | $('{0:N0}' -f $f.Length) | ``$hash`` |"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $files | Format-Table Name, Length -AutoSize | Out-String | Write-Host
